<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerVision AI - Asistente GTO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [potSize, setPotSize] = useState(120);
            const [callAmount, setCallAmount] = useState(40);
            const [stack, setStack] = useState(350);
            const [equity, setEquity] = useState(55);

            const potOdds = callAmount > 0 && (potSize + callAmount) > 0 
                ? Math.round((callAmount / (potSize + callAmount)) * 100) 
                : 0;

            return (
                <div className="min-h-screen p-4 max-w-md mx-auto space-y-4">
                    <header className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-black">♠</div>
                            <h1 className="font-bold text-lg text-white">PokerVision <span className="text-emerald-400">AI</span></h1>
                        </div>
                        <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-bold">98% GTO</span>
                    </header>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                        <h2 className="font-bold text-sm text-slate-200">Parámetros de la Mano</h2>
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="text-[10px] text-slate-400 uppercase">Bote</label>
                                <input type="number" value={potSize} onChange={e => setPotSize(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white font-bold" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 uppercase">A Apostar</label>
                                <input type="number" value={callAmount} onChange={e => setCallAmount(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white font-bold" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 uppercase">Stack</label>
                                <input type="number" value={stack} onChange={e => setStack(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white font-bold" />
                            </div>
                        </div>

                        <div>
                            <label className="text-xs text-slate-400 flex justify-between mb-1">
                                <span>Tu Equity Estimado:</span>
                                <span className="text-emerald-400 font-bold">{equity}%</span>
                            </label>
                            <input type="range" min="1" max="99" value={equity} onChange={e => setEquity(Number(e.target.value))} className="w-full accent-emerald-500" />
                        </div>
                    </div>

                    <div className="bg-gradient-to-r from-emerald-950 via-emerald-900/90 to-slate-900 border-2 border-emerald-500 rounded-2xl p-4 shadow-2xl text-center space-y-2">
                        <span className="text-xs uppercase tracking-widest text-emerald-300 font-bold">Decisión Recomendada GTO</span>
                        <div className="text-2xl font-black text-white">
                            {equity >= potOdds ? (equity > 65 ? "APOSTAR / SUBIR (Value)" : "IGUALAR (Call profitable)") : "ABANDONAR (Fold)"}
                        </div>
                        <p className="text-xs text-slate-300">Pot Odds requeridas: {potOdds}% | Tu Equity: {equity}%</p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
